[browser]
# do not send usage statistics to Streamlit
gatherUsageStats = false

[server]
# only this computer can open the app (by default anyone on the same network could)
address = "localhost"

[theme]
base = "light"
primaryColor = "#0b3d91"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f4f6fa"
textColor = "#1b2333"
font = "sans serif"
