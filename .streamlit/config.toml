[browser]
# do not send usage statistics to Streamlit
gatherUsageStats = false

[server]
# only this computer can open the app (by default anyone on the same network could)
address = "localhost"

[theme]
# the static site's palette and type (site/, scripts/build_site.py): navy, one copper accent, warm white
base = "light"
primaryColor = "#13294b"
backgroundColor = "#fbfaf7"
secondaryBackgroundColor = "#f3f1ec"
textColor = "#13233f"
linkColor = "#13294b"
borderColor = "#e4e1da"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Source Serif 4:https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap, Georgia, serif"
headingFontWeights = 600

[client]
# minimal toolbar: no developer menu and no Deploy button; the app is shown to visitors
toolbarMode = "minimal"
